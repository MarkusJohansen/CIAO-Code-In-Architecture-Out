# CIAO Configuration
# All values here are defaults; CLI flags override them.

# Target repository (GitHub URL or local path)
repo:
  url: "https://github.com/SaraPettinari/ocean-lib"

# LLM backend
llm:
  base_url: "http://localhost:8080/v1"
  model: "~/models/Qwythos-9B-Q4_K_M.gguf"
